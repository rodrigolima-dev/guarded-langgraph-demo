[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-langgraph-demo"
version = "0.1.0"
description = "Offline tenant-scoped retrieval with explicit LangGraph authorization gates"
requires-python = ">=3.12,<3.15"
dependencies = [
  "langgraph==1.2.14",
  "langchain-core==1.6.7",
  "langsmith==0.14.4",
]

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[project.scripts]
guarded-graph = "guarded_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
